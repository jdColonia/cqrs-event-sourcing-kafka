services:
  # Zookeeper para Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    networks:
      - bank-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - '29092:29092'
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - bank-network

  # MongoDB para Event Store (Command Side)
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: bankAccount
    volumes:
      - mongodb_data:/data/db
    networks:
      - bank-network

  # MySQL para Query Side
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: techbankRootPsw
      MYSQL_DATABASE: bankAccount
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bank-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ptechbankRootPsw']
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin - Visualizador de MySQL
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: techbankRootPsw
      MYSQL_ROOT_PASSWORD: techbankRootPsw
    depends_on:
      - mysql
    networks:
      - bank-network

  # Mongo Express - Visualizador de MongoDB
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - bank-network

  # Account Command Service
  account-cmd:
    build:
      context: .
      dockerfile: ./bank-account/account.cmd/Dockerfile
    container_name: account-cmd
    ports:
      - '5000:5000'
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: bankAccount
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mongodb
      - kafka
    networks:
      - bank-network
    restart: on-failure

  # Account Query Service
  account-query:
    build:
      context: .
      dockerfile: ./bank-account/account.query/Dockerfile
    container_name: account-query
    ports:
      - '5001:5001'
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bankAccount?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: techbankRootPsw
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - bank-network
    restart: on-failure

networks:
  bank-network:
    driver: bridge

volumes:
  mongodb_data:
  mysql_data:
